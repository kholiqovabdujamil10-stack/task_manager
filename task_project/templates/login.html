{% extends 'base.html' %}

{% block title %}Вход | Task Manager{% endblock %}

{% block content %}

<section class="hero">
    <h1>С возвращением!</h1>
    <p>Войди в свой аккаунт, чтобы управлять задачами.</p>

    <form method="POST">
        {% csrf_token %}

        <input
            type="text"
            name="username"
            placeholder="Имя пользователя"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Пароль"
            required
        >

        <button type="submit" class="btn">
            Войти
        </button>
    </form>

    <p>
        Нет аккаунта?
        <a href="{% url 'registration' %}">Зарегистрироваться</a>
    </p>
</section>

{% endblock %}
